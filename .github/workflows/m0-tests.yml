name: M0 mathematical reference tests
on:
  push:
    branches: [main, 'research/m0-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Independent tiny MaxCut smoke test
        run: python experiments/m0_reference.py --family maxcut --size 8 --records 100 --output results/ci_maxcut
      - name: Independent tiny TSP smoke test
        run: python experiments/m0_reference.py --family tsp --size 3 --records 100 --output results/ci_tsp
