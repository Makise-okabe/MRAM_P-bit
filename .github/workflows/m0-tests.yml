name: Default-branch generic Ising math and coupling-format tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generic Ising energy and symmetric-coupling tests
        run: python -m unittest discover -s tests -p 'test_m0_ising_math.py' -v
      - name: Low-order coupling element-format tests
        run: python -m unittest discover -s tests -p 'test_m1_coupling_formats.py' -v
      - name: Finite element codebook tests
        run: python -m unittest discover -s tests -p 'test_m1_finite_fp_formats.py' -v
# Active Biq Mac graph/solver CI and code live on the draft research branch.
