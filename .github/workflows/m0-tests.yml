name: M0 Biq Mac weighted Max-Cut mapping verification

on:
  push:
    branches: [main, 'research/m0-biqmac-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m0-maxcut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile original-weight Rudy parser
        run: python -m py_compile experiments/biqmac_maxcut.py experiments/biqmac_weight_audit.py experiments/m1_biqmac_reference_quality_gate.py experiments/m3_sixbit_encoding.py experiments/m3_actual_graph_row_vectors.py
      - name: Exact signed weighted-cut and Ising consistency tests
        run: python -m unittest discover -s tests -p 'test_biqmac*py' -v
      - name: M1 bounded ideal Max-Cut solver mathematical invariants
        run: python -m unittest discover -s tests -p 'test_m1_biqmac_ideal_pilot.py' -v
      - name: M1 paired-seed report consistency checks
        run: python -m unittest discover -s tests -p 'test_m1_biqmac_paired_report.py' -v
      - name: Official Biq Mac optimum provenance + FP64 bounded quality gate invariants
        run: python -m unittest discover -s tests -p 'test_m1_biqmac_reference_quality_gate.py' -v
      - name: Frozen 4-5-6-8 bit precision codebooks, exact integer, paired-seed and symmetry checks
        run: python -m unittest discover -s tests -p 'test_m1_precision_global.py' -v
      - name: Bounded E2 response gate parity/persistence checks (NO device or solver sweep)
        run: python -m unittest discover -s tests -p 'test_m2_e2_response_gate.py' -v
      - name: Literature STT-MTJ nominal transfer preflight, no fabricated device data
        run: python -m unittest discover -s tests -p 'test_m2_stt_pbit_transfer_preflight.py' -v

# Older MIMO source/tests are intentionally preserved as historical research.
# This ACTIVE benchmark CI does not run MIMO, quantization sweeps or devices.
# Actual Biq Mac source downloads and SHA256 audits run separately on NUS.
