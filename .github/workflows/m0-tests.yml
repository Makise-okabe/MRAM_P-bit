name: M0 BPSK MIMO and generic Ising verification
on:
  push:
    branches: [main, 'research/m0-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generic Ising and complex MIMO mathematical tests
        run: python -m unittest discover -s tests -v
      - name: Standalone BPSK MIMO smoke test
        run: python experiments/m0_mimo_reference.py --tx 4 --rx 4 --snr-db 10 --records 100 --output results/ci_mimo4x4
