name: Build Overleaf-compatible report PDF
on:
  push:
    branches: [main]
    paths:
      - 'main.tex'
      - 'references.bib'
      - 'report/sections/**'
      - '.github/workflows/build-report.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mram-pathfinding-pdf
  cancel-in-progress: false
jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Create PDF and Overleaf source ZIP
        run: |
          mkdir -p report
          cp main.pdf report/MRAM_Pathfinding_Report.pdf
          zip -q -r report/MRAM_Overleaf_Project.zip main.tex references.bib report/sections
      - name: Commit report deliverables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/MRAM_Pathfinding_Report.pdf report/MRAM_Overleaf_Project.zip
          if ! git diff --cached --quiet; then
            git commit -m "report: publish PDF and Overleaf source ZIP [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MRAM_Pathfinding_Overleaf
          path: |
            report/MRAM_Pathfinding_Report.pdf
            report/MRAM_Overleaf_Project.zip
