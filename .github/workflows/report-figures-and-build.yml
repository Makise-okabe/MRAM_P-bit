name: FYP report figures and PDF
on:
  push:
    branches: [main]
    paths:
      - main.tex
      - references.bib
      - 'report/maxcut/**'
      - scripts/plot_report_figures.py
      - .github/workflows/report-figures-and-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the authoritative report repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install plotting dependency
        run: python -m pip install 'matplotlib>=3.8,<4'

      - name: Draw all five figures from committed calibration tables
        run: python scripts/plot_report_figures.py --out report/figures

      - name: Verify five visible PNG and vector PDF figures
        shell: bash
        run: |
          set -euo pipefail
          test "$(find report/figures -maxdepth 1 -name '*.png' | wc -l)" -eq 5
          test "$(find report/figures -maxdepth 1 -name '*.pdf' | wc -l)" -eq 5
          find report/figures -maxdepth 1 -type f -size +1000c -print

      - name: Upload actual rendered figure files to this repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f report/figures/*.png report/figures/*.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Render five FYP report figures as actual PDF and PNG files"
            git push origin HEAD:main
          fi

      - name: Compile the report from main.tex
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex

      - name: Make compiled PDF available
        uses: actions/upload-artifact@v4
        with:
          name: FYP-coupling-matrix-report
          path: |
            main.pdf
            report/figures/*.png
            report/figures/*.pdf
          if-no-files-found: error
