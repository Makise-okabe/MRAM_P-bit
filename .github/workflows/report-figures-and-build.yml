name: FYP thesis figures and PDF verification
on:
  push:
    branches: [main]
    paths:
      - main.tex
      - references.bib
      - 'report/maxcut/**'
      - 'report/history/**'
      - scripts/make_thesis_figures.py
      - .github/workflows/report-figures-and-build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout pinned report commit
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic plotting environment
        run: python -m pip install 'numpy==2.3.5' 'matplotlib==3.10.7' 'pillow>=11,<13'
      - name: Generate thesis figures from pinned registered archives
        run: python scripts/make_thesis_figures.py --out report/figures
      - name: Inspect artifact existence, legibility and nonblank image dimensions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          root = Path("report/figures")
          names = [f"F{i:02d}" for i in range(1,13)]
          for name in names:
              matches = sorted(root.glob(f"{name}_*.png"))
              if len(matches) != 1:
                  raise RuntimeError(f"{name}: expected one scientific figure, found {matches}")
              p = matches[0]
              pdf = p.with_suffix(".pdf")
              if not pdf.exists() or pdf.stat().st_size < 1000:
                  raise RuntimeError(f"{name}: vector output missing or tiny")
              with Image.open(p) as im:
                  if im.width < 1000 or im.height < 300:
                      raise RuntimeError(f"{name}: rendering too small {im.size}")
                  bands = ImageStat.Stat(im.convert("RGB")).stddev
                  if max(bands) < 10:
                      raise RuntimeError(f"{name}: likely blank image")
              print(f"Rendered preview: {p.name} bytes={p.stat().st_size}")
          if len(list(root.glob("F11_*.png"))) != 1:
              raise RuntimeError("Verified device-offset figure F11 must exist exactly once")
          PY
      - name: Compile report with BibTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
      - name: Upload PDF and figure previews for manual scientific review
        uses: actions/upload-artifact@v4
        with:
          name: FYP-thesis-review-pdf-and-figures
          path: |
            main.pdf
            report/figures/F*.png
            report/figures/F*.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Commit manually reviewed generated vector and raster figures for Overleaf
        shell: bash
        run: |
          set -euo pipefail
          test "$(find report/figures -maxdepth 1 -name 'F*.png' | wc -l)" -eq 12
          test "$(find report/figures -maxdepth 1 -name 'F*.pdf' | wc -l)" -eq 12
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f report/figures/F*.png report/figures/F*.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish 12 vetted FYP thesis figures derived from frozen scientific archives"
            git push origin HEAD:refs/heads/main
          fi
